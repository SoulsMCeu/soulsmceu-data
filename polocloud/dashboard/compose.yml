# To start this:
# (once) docker buildx create --name gitbuilder --driver docker-container --use
# docker compose up -d --build
services:
  polocloud-dashboard:
    container_name: polocloud-dashboard
    build: https://github.com/thePolocloud/polocloud-dashboard.git
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
